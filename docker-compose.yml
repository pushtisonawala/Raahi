services:
  # All-in-one Jaeger: collector + query UI + in-memory storage in one
  # container. Not meant for production (traces vanish on restart, no
  # persistence, no scaling) - it exists purely so tracing has somewhere
  # local to send spans to while developing. In production you'd point
  # OTEL_EXPORTER_OTLP_ENDPOINT at a real backend (Grafana Tempo, Honeycomb,
  # a managed Jaeger, etc) instead.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686" # web UI - http://localhost:16686
      - "4318:4318"   # OTLP/HTTP receiver - what api's OTEL_EXPORTER_OTLP_ENDPOINT points at
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  redis:
    image: redis:7-alpine
    ports:
      # host-side port only, changed from 6379 to dodge a local conflict -
      # the api container still reaches this over the internal Docker
      # network at redis:6379 regardless (see REDIS_URL below), so this
      # only matters if you want to hit Redis from your host with
      # redis-cli.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raahi
      POSTGRES_PASSWORD: raahi_dev
      POSTGRES_DB: raahi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raahi -d raahi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://raahi:raahi_dev@postgres:5432/raahi?sslmode=disable
      JWT_SECRET: some-long-random-string-change-this-later
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://raahi-navy.vercel.app
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  pgdata:
